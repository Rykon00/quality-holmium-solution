[mod-name]
quality-holmium-solution=Quality Holmium Solution

[mod-description]
quality-holmium-solution=Higher quality holmium ore gives more holmium solution. Adds one holmium solution recipe per quality to the chemical plant, each only accepts ore of that quality. No new buildings.

[recipe-name]
qhs-holmium-solution=__FLUID__holmium-solution__ (__1__ __ITEM__holmium-ore__)

[recipe-description]
qhs-holmium-solution=Only accepts __1__ __ITEM__holmium-ore__. Gives __2__% of the normal amount of __FLUID__holmium-solution__.

[mod-setting-name]
qhs-bonus-per-level=Extra holmium solution per quality level (%)
qhs-lock-vanilla-to-normal=Vanilla recipe only accepts normal ingredients

[mod-setting-description]
qhs-bonus-per-level=Extra output per quality level of the ore, in percent of the vanilla amount. Levels: uncommon 1, rare 2, epic 3, legendary 5. With 50: uncommon 150%, rare 200%, epic 250%, legendary 350%.
qhs-lock-vanilla-to-normal=Fixes all item ingredients of the vanilla holmium solution recipe to normal quality, so quality ore is never used up there for the normal amount.
