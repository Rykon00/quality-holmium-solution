[mod-name]
quality-holmium-solution=Quality Holmium Solution

[mod-description]
quality-holmium-solution=Holmiumerz höherer Qualität ergibt mehr Holmiumlösung. Fügt der Chemiefabrik pro Qualität ein eigenes Holmiumlösungs-Rezept hinzu, das nur Erz dieser Qualität annimmt. Keine neuen Gebäude.

[recipe-name]
qhs-holmium-solution=__FLUID__holmium-solution__ (__1__ __ITEM__holmium-ore__)

[recipe-description]
qhs-holmium-solution=Nimmt nur __ITEM__holmium-ore__ der Qualität __1__ an. Ergibt __2__ % der normalen Menge __FLUID__holmium-solution__.

[mod-setting-name]
qhs-bonus-per-level=Zusätzliche Holmiumlösung pro Qualitätsstufe (%)
qhs-lock-vanilla-to-normal=Vanilla-Rezept nimmt nur normale Zutaten

[mod-setting-description]
qhs-bonus-per-level=Mehrertrag pro Qualitätsstufe des Erzes, in Prozent der Vanilla-Menge. Stufen: Ungewöhnlich 1, Selten 2, Episch 3, Legendär 5. Mit 50: Ungewöhnlich 150 %, Selten 200 %, Episch 250 %, Legendär 350 %.
qhs-lock-vanilla-to-normal=Legt alle Item-Zutaten des Vanilla-Holmiumlösungs-Rezepts auf normale Qualität fest, damit dort nie Qualitätserz für die normale Menge verbraucht wird.
